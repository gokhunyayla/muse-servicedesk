# ============================================================
# Pull request'lerde test. main'e push'ta testler deploy.yml içinde koşar
# (geçmezse canlıya çıkmaz).
# ============================================================
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          DATABASE_URL: sqlite:///./ci.db
